<title>TRADE — 預覽</title>
<style>:root{
  --bg:#0d1117; --panel:#151b23; --panel2:#1b232d; --line:#26303b;
  --fg:#eaf0f6; --dim:#8b9aab; --dim2:#5f6f80;
  --up:#34d399; --down:#f87171; --amber:#fbbf24; --violet:#a78bfa; --blue:#60a5fa; --teal:#2dd4bf;
  --safe: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
body{
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC",system-ui,sans-serif;
  padding-bottom:0;
}
header{
  position:sticky;top:0;z-index:20;background:rgba(13,17,23,.92);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);
  padding:10px 14px 8px;
}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:17px;margin:0;letter-spacing:.02em}
.tag{font-size:11px;color:var(--dim);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border-radius:999px;
  border:1px solid var(--line);color:var(--dim);background:var(--panel)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
nav{position:sticky;top:52px;z-index:19;display:flex;gap:4px;background:var(--bg);
  border-bottom:1px solid var(--line);padding:6px 10px;}
nav button{
  flex:1;background:transparent;border:0;color:var(--dim);font:inherit;font-size:13px;
  padding:8px 4px;border-radius:9px;cursor:pointer;
}
nav button[aria-selected="true"]{background:var(--panel2);color:var(--fg);font-weight:600}
main{padding:12px 12px calc(24px + var(--safe));max-width:760px;margin:0 auto}
section{display:none}
section.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:8px}
.card h2{font-size:12px;color:var(--dim);margin:0 0 10px;font-weight:600;letter-spacing:.04em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 .kpi{padding:8px 9px}
.grid3 .kpi .k{font-size:10px}
.grid3 .kpi .v{font-size:15px}
.grid3 .kpi .s{font-size:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 11px}
.kpi .k{font-size:11px;color:var(--dim);display:flex;justify-content:space-between;align-items:center}
.kpi .v{font-size:18px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:3px}
.kpi .s{font-size:11px;color:var(--dim2);margin-top:2px}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--dim)}
.warn{background:#3a2a10;border:1px solid #6b4a12;color:#ffc266;border-radius:12px;padding:10px;font-size:12.5px;margin-bottom:10px}
.order{border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-bottom:8px;background:var(--panel2)}
.ohead{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.onums{font-size:12px;color:var(--dim);margin-top:2px;font-variant-numeric:tabular-nums}
.oreason{font-size:11.5px;color:#b9c5d2;margin-top:5px;line-height:1.45}
.minirow{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #1f2732;font-size:13px;font-variant-numeric:tabular-nums}
.minirow:last-child{border-bottom:0}
.minirow b{color:#eaf0f6}
.rows{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #1f2732;font-size:13px}
.rows:last-child{border-bottom:0}
.rows .k{color:var(--dim)}
.rows .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);color:#c8d4e0;
  border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:11.5px;cursor:pointer}
.chip.on{background:#223143;color:#fff;border-color:#39506a}
.chip.off{opacity:.4}
.chip b{font-weight:400;color:#7d8c9c}
select{background:var(--panel2);color:#c8d4e0;border:1px solid var(--line);border-radius:999px;
  padding:6px 8px;font:inherit;font-size:11.5px;max-width:132px}
.hint{font-size:10.5px;color:var(--dim2);display:inline-block;margin-top:4px}
svg{display:block;width:100%;height:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:right;padding:7px 4px;border-bottom:1px solid #1f2732;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--dim);font-size:10.5px;font-weight:600}
td{font-variant-numeric:tabular-nums}
.empty{border:1px dashed #2b3542;border-radius:12px;padding:16px;text-align:center;color:var(--dim);font-size:13px}
.foot{color:var(--dim2);font-size:10.5px;line-height:1.6;margin-top:8px}
.decision .act{font-size:18px;font-weight:700}
.trade{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--panel2)}
.thead{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.tnums{font-size:12.5px;margin-top:3px;font-variant-numeric:tabular-nums}
.tfees{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.treason{font-size:11px;color:#b9c5d2;margin-top:4px}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;margin:12px 0 4px;background:#1b232d}
.bar i{display:block;height:100%}
.hold{border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-bottom:8px;background:var(--panel2)}
.hmain{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.hsub{font-size:11.5px;color:var(--dim);margin-top:2px;font-variant-numeric:tabular-nums}
.hrow{display:flex;justify-content:space-between;font-size:12.5px;margin-top:6px;font-variant-numeric:tabular-nums}
.hrow2{display:grid;grid-template-columns:1.15fr .55fr .7fr .7fr .95fr .95fr;gap:4px;align-items:center;
  padding:8px 2px;border-bottom:1px solid #1f2732;font-size:12px;font-variant-numeric:tabular-nums}
.hrow2 span{text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow2 span:first-child{text-align:left}
.hrow2.hhead{color:var(--dim2);font-size:10px;border-bottom:1px solid var(--line)}
.hold .up,.hold .down{font-weight:600}
.path{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
</style>

<script>/* TRADE dashboard — 分頁式前端（無框架、無 CDN） */
(() => {
  const D = window.__DATA__;
  const $ = (s) => document.querySelector(s);
  const el = (id) => document.getElementById(id);
  const money = (n) => (n == null ? '—' : 'HK$' + Math.round(n).toLocaleString());
  const pct = (x) => (x == null ? '—' : (x >= 0 ? '+' : '') + (x * 100).toFixed(2) + '%');
  const cls = (x) => (x > 0.0005 ? 'up' : x < -0.0005 ? 'down' : 'flat');
  const COLORS = ['#60a5fa', '#34d399', '#fbbf24', '#f87171', '#a78bfa', '#2dd4bf'];
  const store = {
    get() { try { return JSON.parse(localStorage.getItem('tradeChart') || '{}'); } catch { return {}; } },
    set(v) { try { localStorage.setItem('tradeChart', JSON.stringify(v)); } catch (e) {} },
  };

  /* ---------- 頭部 ---------- */
  const QH = D.quoteHealth;
  const live = !!(QH && (QH.HK?.fresh || QH.US?.fresh));
  el('headPill').innerHTML = `<span class="dot" style="background:${live ? 'var(--up)' : 'var(--dim2)'}"></span>` +
    (live ? '開市' : '休市');
  const builtHM = new Date(D.builtAt).toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit' });
  el('headTag').textContent = (D.preview ? '預覽 ' : `${D.series.length} 隻 · `) +
    `日線 ${String(D.barsFetchedAt).slice(5, 10)} · 建於 ${builtHM}`;
  if (D.preview) el('previewBar').innerHTML = '<div class="warn">🧪 預覽模式：交易同曲線係示範數據，真數據睇 dashboard.html</div>';

  /* ---------- 分頁 ---------- */
  const tabs = ['overview', 'positions', 'charts', 'log'];
  function showTab(name) {
    tabs.forEach((t) => {
      el('tab-' + t).classList.toggle('on', t === name);
      const b = el('nav-' + t);
      b.setAttribute('aria-selected', String(t === name));
    });
    store.set({ ...store.get(), tab: name });
    window.scrollTo({ top: 0 });
  }
  tabs.forEach((t) => el('nav-' + t).onclick = () => showTab(t));

  /* ---------- 總覽 ---------- */
  const LR = D.lanes.R, LT = D.lanes.T, LA = D.lanes.A;
  const todayFills = (D.trades || []).filter((x) => (x.fill?.ts || x.ts_decision) === new Date().toISOString().slice(0, 10)).length;

  const LM = D.lanes.M, LX = D.lanes.X;
  const retStr = (l) => (l.totalReturn >= 0 ? '+' : '') + l.totalReturn + '%';
  el('kpiGrid').innerHTML = [
    { k: 'R 保守', v: money(LR.equity), s: retStr(LR), c: 'var(--amber)' },
    { k: 'M 平衡', v: money(LM.equity), s: retStr(LM), c: 'var(--blue)' },
    { k: 'X 進取', v: money(LX.equity), s: retStr(LX), c: 'var(--down)' },
    { k: 'T 低注', v: money(LT.equity), s: LT.lastAt ? '更新 ' + new Date(LT.lastAt).toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit' }) : '等開市', c: 'var(--teal)' },
    { k: 'A AI', v: money(LA.equity), s: LA.decision ? LA.decision.action : '未開鐘', c: 'var(--violet)' },
    { k: '今日成交', v: String(todayFills), s: `等權 ${pct(D.equalWeight.stats.ret)}`, c: 'var(--dim)' },
  ].map((x) => `<div class="kpi"><div class="k"><span>${x.k}</span><i class="dot" style="background:${x.c}"></i></div>
      <div class="v">${x.v}</div><div class="s">${x.s}</div></div>`).join('');

  const blocked = (LR.blocked || []);
  el('todayBlock').innerHTML =
    (blocked.length ? blocked.map((b) => `<div class="warn">🚧 ${b.reason}</div>`).join('') : '') +
    (() => {
      const all = [];
      for (const k of ['R', 'M', 'X']) for (const o of (D.lanes[k].pending || [])) all.push({ ...o, lane: k });
      return all.length
        ? `<div class="card"><h2>今日待成交（下一個交易日開市）</h2>` +
          all.slice(0, 9).map((o) => `<div class="minirow"><span><b>${o.lane}</b> · ${o.action === 'buy' ? '買' : '賣'} ${o.sym}</span>
              <span>${o.qty} 股 · ${money(o.notional_hkd)}</span></div>`).join('') +
          '</div>'
        : '<div class="card"><div class="empty">今日冇新訂單</div></div>';
    })();

  el('quoteHealth').innerHTML = QH
    ? `<div class="minirow"><span>港股報價 ${QH.HK ? QH.HK.lag_s + 's' : '—'} ${QH.HK?.fresh ? '✅' : '❌'}</span>
         <span>美股報價 ${QH.US ? QH.US.lag_s + 's' : '—'} ${QH.US?.fresh ? '✅' : '❌'}</span></div>
       <div class="hint">Lane T 更新 ${new Date(QH.at).toLocaleTimeString('zh-HK')}　·　報價超過 300 秒唔准交易</div>`
    : '<div class="empty">Lane T 未啟動</div>';

  /* ---------- 組合 ---------- */
  let posLane = store.get().posLane || 'R';
  const fmtSigned = (n, suffix = '') => (n == null ? '—' : (n >= 0 ? '+' : '') + Math.round(n).toLocaleString() + suffix);

  function drawPortfolio() {
    const L = D.lanes[posLane];
    const sw = el('laneSwitch');
    sw.innerHTML = ['R', 'M', 'X', 'T', 'A'].map((k) => {
      const on = k === posLane;
      return `<button class="chip ${on ? 'on' : 'off'}" data-lane="${k}">Lane ${k}</button>`;
    }).join('');
    const meta = (D.laneMeta || {})[posLane];
    if (meta) {
      el('laneInfo').textContent = `${meta.label}　風險 ${meta.risk}%　上限 ${meta.cap}%　回撤剎停 ${meta.dd}%　${meta.exec === 'live' ? '即時成交' : '下一開市'}`;
      el('laneUniverse').innerHTML = '成分：' + meta.universe.map((x) => `<span class="chip" style="padding:3px 7px;margin:2px 4px 2px 0;font-size:10.5px">${x}</span>`).join('');
    }
    sw.querySelectorAll('[data-lane]').forEach((b) => b.onclick = () => {
      posLane = b.dataset.lane;
      store.set({ ...store.get(), posLane });
      drawPortfolio();
    });

    const pnlCls = (n) => (n > 0.005 ? 'up' : n < -0.005 ? 'down' : 'flat');
    el('posSummary').innerHTML = [
      { k: '總資產', v: money(L.equity), s: `總回報 ${L.totalReturn >= 0 ? '+' : ''}${L.totalReturn}%`, c: pnlCls(L.totalReturn) },
      { k: '可用現金', v: money(L.cash), s: `佔 ${L.cash_pct}%`, c: '' },
      { k: '持倉市值', v: money(L.mv_hkd), s: `${L.positions.length} 隻 · 成本 ${money(L.cost_hkd)}`, c: '' },
      { k: '未實現盈虧', v: fmtSigned(L.unrealized), s: `${L.unrealized_pct >= 0 ? '+' : ''}${L.unrealized_pct}%`, c: pnlCls(L.unrealized) },
      { k: '已實現盈虧', v: fmtSigned(L.realized), s: `已扣費用 ${money(L.feesTotal)}`, c: pnlCls(L.realized) },
      { k: '回撤', v: `${L.dd_pct}%`, s: '由最高點計', c: pnlCls(L.dd_pct) },
    ].map((x) => `<div class="kpi"><div class="k">${x.k}</div>
        <div class="v ${x.c}">${x.v}</div><div class="s">${x.s}</div></div>`).join('');

    // 資產分佈條
    const segs = [{ label: '現金', pct: L.cash_pct, color: '#3d4b5b' }]
      .concat(L.positions.map((p, i) => ({ label: p.sym, pct: p.weight, color: ['#fbbf24', '#a78bfa', '#2dd4bf', '#60a5fa', '#f87171', '#34d399'][i % 6] })));
    el('posBar').innerHTML = segs.map((x) => `<i style="width:${Math.max(0, x.pct)}%;background:${x.color}"></i>`).join('');

    // 持倉明細（手機：每個持倉一張卡）
    el('holdings').innerHTML = L.positions.length
      ? L.positions.map((p) => `<div class="hold">
          <div class="hmain"><b>${p.sym}</b><span class="pill">${p.weight}%</span></div>
          <div class="hsub">${p.qty} 股 · 成本 ${p.entry} · 現價 ${p.last}</div>
          <div class="hrow"><span>市值 ${money(p.mv_hkd)}</span>
            <span class="${pnlCls(p.pnl)}">${fmtSigned(p.pnl)}（${p.pnl_pct >= 0 ? '+' : ''}${p.pnl_pct}%）</span></div>
        </div>`).join('')
      : '<div class="empty">而家空倉（100% 現金）。<br><span style="font-size:11px">成交後呢度會列持倉、成本、盈虧。</span></div>';

    el('pendingBox').innerHTML = (L.pending && L.pending.length)
      ? L.pending.map((o) => `<div class="order"><div class="ohead"><b>${o.action === 'buy' ? '買入' : '賣出'} ${o.sym}</b>
          <span class="pill">${o.qty} 股</span></div>
          <div class="onums">參考 ${o.ref_px}${o.notional_hkd ? ' · ' + money(o.notional_hkd) + '（' + o.weight_pct + '%）' : ''}</div>
          <div class="oreason">${o.reason || ''}</div></div>`).join('')
      : '<div class="empty">冇待成交訂單</div>';

    const OV = D.overlap || [];
    el('overlapBox').innerHTML = OV.length
      ? OV.map((o) => `<div class="minirow"><span><b>${o.sym}</b> ×${o.lanes.length} 條線（${o.lanes.map((x) => x.lane).join('/')}）</span>
          <span>合計權重 ${o.totalWeight}%</span></div>`).join('') +
        '<div class="hint">同一隻股喺多條 lane 出現 = 疊加曝險，唔係分散。</div>'
      : '<div class="empty">暫時冇持倉重疊（全部空倉）</div>';

    el('decisionCard').style.display = (posLane === 'A' && LA.decision) ? 'block' : 'none';
    el('decisionBox').innerHTML = posLane === 'A' && LA.decision
      ? `<div class="decision"><div class="rows"><span class="k">最新動作</span><span class="v act">${LA.decision.action} ${LA.decision.symbol || ''} ${LA.decision.qty || ''}</span></div>
         <div class="rows"><span class="k">信心</span><span class="v">${LA.decision.confidence}</span></div>
         <p style="font-size:13px;line-height:1.6;margin:10px 0 6px"><b>理由：</b>${LA.decision.reason}</p>
         <p style="font-size:12px;color:var(--dim);line-height:1.6;margin:0"><b>失效條件：</b>${LA.decision.invalidation}</p>
         <div class="hint">決策者：${LA.decider || '—'}</div></div>`
      : '';
  }

  el('positionsBox').innerHTML =
    `<div class="card"><div class="legend" id="laneSwitch" style="margin:0 0 10px"></div>
       <div class="grid2" id="posSummary"></div>
       <div class="bar" id="posBar"></div>
       <div class="hint" id="laneInfo" style="margin-bottom:4px"></div>
       <div class="hint" id="laneUniverse" style="margin-bottom:6px;line-height:2"></div>
       <div class="hint">資產分佈（現金＋持倉權重）</div>
     </div>
     <div class="card"><h2>持倉明細</h2><div id="holdings"></div></div>
     <div class="card"><h2>待成交訂單</h2><div id="pendingBox"></div></div>
     <div class="card"><h2>跨 lane 重疊</h2><div id="overlapBox"></div></div>
     <div class="card" id="decisionCard" style="display:none"><h2>Lane A 最新決定</h2><div id="decisionBox"></div></div>`;

  drawPortfolio();

  /* ---------- 圖表 ---------- */
  const PX_ALL = [...D.series.map((s) => ({ k: s.sym, pts: s.pts })), { k: '中位數', pts: D.equalWeight.pts }];
  const saved = store.get();
  let priceVisible = Array.isArray(saved.price) && saved.price.length
    ? saved.price.map((k) => (k === '等權' ? '中位數' : k))
    : ['2800.HK', 'SPY', '中位數'];
  let eqVisible = Array.isArray(saved.eq) && saved.eq.length ? saved.eq : ['R', 'A', 'T'];
  const persist = () => store.set({ ...store.get(), price: priceVisible, eq: eqVisible });

  const axis = (min, max, W, H, P) => {
    let g = '';
    for (let i = 0; i <= 3; i++) {
      const v = min + (max - min) * i / 3;
      const y = H - P - (v - min) / ((max - min) || 1) * (H - 2 * P);
      g += `<line x1="${P}" y1="${y}" x2="${W - P}" y2="${y}" stroke="#26303b"/>`;
      g += `<text x="${W - P}" y="${y - 3}" fill="#5f6f80" font-size="9" text-anchor="end">${Math.round(v).toLocaleString()}</text>`;
    }
    return g;
  };

  function drawPrice() {
    const sel = PX_ALL.filter((s) => priceVisible.includes(s.k));
    const box = el('priceChart'), leg = el('priceLegend');
    if (!sel.length) { box.innerHTML = ''; leg.innerHTML = '<span class="hint">未揀線</span>'; return; }
    const W = 340, H = 190, P = 10;
    const all = sel.flatMap((s) => s.pts.map((p) => p[1]));
    const min = Math.min(100, ...all) * 0.98, max = Math.max(...all) * 1.02;
    const t0 = Math.min(...sel.map((s) => s.pts[0][0])), t1 = Math.max(...sel.map((s) => s.pts.at(-1)[0]));
    const X = (t) => P + (t - t0) / ((t1 - t0) || 1) * (W - 2 * P);
    const Y = (v) => H - P - (v - min) / ((max - min) || 1) * (H - 2 * P);
    let svg = `<svg viewBox="0 0 ${W} ${H}">` + axis(min, max, W, H, P);
    svg += `<line x1="${P}" y1="${Y(100)}" x2="${W - P}" y2="${Y(100)}" stroke="#3d4b5b" stroke-dasharray="3 3"/>`;
    sel.forEach((s) => {
      const c = COLORS[PX_ALL.findIndex((x) => x.k === s.k) % COLORS.length];
      svg += `<path class="path" d="${s.pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ')}" stroke="${c}"/>`;
    });
    svg += `<text x="${P}" y="${H - 2}" fill="#5f6f80" font-size="9">${new Date(t0).toISOString().slice(0, 7)}</text>`;
    svg += `<text x="${W - P}" y="${H - 2}" fill="#5f6f80" font-size="9" text-anchor="end">${new Date(t1).toISOString().slice(0, 7)}</text></svg>`;
    box.innerHTML = svg;

    const rest = PX_ALL.filter((s) => !priceVisible.includes(s.k));
    leg.innerHTML = sel.map((s) => {
      const c = COLORS[PX_ALL.findIndex((x) => x.k === s.k) % COLORS.length];
      return `<button class="chip on" data-p="${s.k}"><i class="dot" style="background:${c}"></i>${s.k}<b>×</b></button>`;
    }).join('') +
      (rest.length ? `<select id="addP"><option value="">＋ 加線</option>${rest.map((s) => `<option value="${s.k}">${s.k}</option>`).join('')}</select>` : '');
    leg.querySelectorAll('[data-p]').forEach((b) => b.onclick = () => {
      priceVisible = priceVisible.filter((k) => k !== b.dataset.p); persist(); drawPrice();
    });
    const addP = el('addP');
    if (addP) addP.onchange = (e) => { if (e.target.value) { priceVisible = [...priceVisible, e.target.value]; persist(); drawPrice(); } };
  }

  function drawEquity() {
    const EQ = D.equitySeries || { R: [], A: [], T: [] };
    const ALL = [['R', 'var(--amber)'], ['M', 'var(--blue)'], ['X', 'var(--down)'], ['A', 'var(--violet)'], ['T', 'var(--teal)']];
    const box = el('eqChart');
    const sel = ALL.filter(([k]) => eqVisible.includes(k));
    const pts = sel.flatMap(([k]) => (EQ[k] || []).filter((p) => Number.isFinite(p[1])));
    const hasLine = sel.some(([k]) => (EQ[k] || []).filter((q) => Number.isFinite(q[1])).length >= 2);
    let html = '';
    if (pts.length >= 2 && hasLine) {
      const W = 340, H = 140, P = 10;
      const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
      const x0 = Math.min(...xs), x1 = Math.max(...xs);
      const y0 = Math.min(...ys) * 0.999, y1 = Math.max(...ys) * 1.001;
      const X = (t) => P + (t - x0) / ((x1 - x0) || 1) * (W - 2 * P);
      const Y = (v) => H - P - (v - y0) / ((y1 - y0) || 1) * (H - 2 * P);
      let svg = `<svg viewBox="0 0 ${W} ${H}">` + axis(y0, y1, W, H, P);
      sel.forEach(([k, c]) => {
        const p = (EQ[k] || []).filter((q) => Number.isFinite(q[1]));
        if (p.length < 2) return;
        svg += `<path class="path" d="${p.map((q, i) => (i ? 'L' : 'M') + X(q[0]).toFixed(1) + ' ' + Y(q[1]).toFixed(1)).join(' ')}" stroke="${c}"/>`;
      });
      html = svg + '</svg>';
    } else {
      html = '<div class="empty">得 1 個資料點。<br>成交後每晚加一點。</div>';
    }
    html += '<div class="legend">' + ALL.map(([k, c]) => {
      const last = (EQ[k] || []).at(-1)?.[1];
      const on = eqVisible.includes(k);
      return `<button class="chip ${on ? 'on' : 'off'}" data-e="${k}"><i class="dot" style="background:${c}"></i>Lane ${k} ${last ? money(last) : '—'}</button>`;
    }).join('') + '</div>';
    box.innerHTML = html;
    box.querySelectorAll('[data-e]').forEach((b) => b.onclick = () => {
      const k = b.dataset.e;
      eqVisible = eqVisible.includes(k) ? eqVisible.filter((x) => x !== k) : [...eqVisible, k];
      persist(); drawEquity();
    });
  }

  /* ---------- 紀錄 ---------- */
  const TR = (D.trades || []).slice().reverse();
  el('tradesBox').innerHTML = TR.length
    ? TR.map((t) => `<div class="trade"><div class="thead"><b>${t.side === 'buy' ? '買入' : '賣出'} ${t.sym}</b>
        <span class="pill">${t.lane || ''} · ${t.fill?.ts || t.ts_decision || ''}</span></div>
        <div class="tnums">${t.qty} 股 @ ${t.fill?.px ?? '—'} · ${money(t.notional_hkd)}</div>
        <div class="tfees">費用 ${money(t.fees?.total_hkd)} · 滑價 ${t.fill?.slip_bps ?? '—'}bps · ${t.rule_version || ''}</div>
        <div class="treason">${(t.reason || '').slice(0, 110)}</div></div>`).join('')
    : '<div class="empty">0 筆成交。<br><span style="font-size:11px">冇成交就係冇成交 —— 唔會憑空作數。</span></div>';

  const rows = [...D.series].sort((a, b) => a.sym.localeCompare(b.sym));
  el('statsBox').innerHTML = `<table><tr><th>標的</th><th>最新</th><th>${D.spanYears ?? 2}年回報</th><th>回撤</th><th>波動</th></tr>` +
    rows.map((s) => `<tr><td>${s.sym}</td><td>${s.lastClose.toFixed(2)}</td>
      <td class="${cls(s.stats.ret)}">${pct(s.stats.ret)}</td>
      <td class="down">${pct(s.stats.mdd)}</td><td>${(s.stats.vol * 100).toFixed(0)}%</td></tr>`).join('') + '</table>';

  /* ---------- 初始化 ---------- */
  el('foot').innerHTML = `日線：Yahoo（免 key）· 即時：Tencent + Sina 備源（非官方）<br>
    資產以港幣計，USD 按 ${D.fx ?? 7.78} 換算 · 未計真錢、未接券商`;
  showTab(store.get().tab || 'overview');
  drawPrice();
  drawEquity();

  /* ---------- 自動更新：伺服器有新版就 reload（保留分頁） ---------- */
  const REFRESH_MS = Math.max(5, Number(new URLSearchParams(location.search).get('refresh') || 45)) * 1000;
  let stamp = null;
  async function checkUpdate() {
    if (document.hidden) return;
    try {
      const r = await fetch(location.pathname + location.search, { method: 'HEAD', cache: 'no-store' });
      const tag = r.headers.get('etag') || r.headers.get('last-modified') || String(r.headers.get('content-length') || '');
      if (!tag) return;
      if (stamp === null) { stamp = tag; return; }
      if (tag !== stamp) {
        const u = new URL(location.href);
        u.searchParams.set('_v', String(Date.now())); // 破 10 分鐘 cache
        location.replace(u.toString());
      }
    } catch (e) {}
  }
  setInterval(checkUpdate, REFRESH_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>

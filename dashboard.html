<title>TRADE — 儀表板</title>
<style>:root{
  color-scheme:dark;
  --bg:#0d1117; --panel:#151b23; --panel2:#1b232d; --line:#26303b;
  --fg:#eaf0f6; --dim:#8b9aab; --dim2:#8593a6; --focus:#7dd3fc; --headh:56px;
  --up:#34d399; --down:#f87171; --amber:#fbbf24; --violet:#a78bfa; --blue:#60a5fa; --teal:#2dd4bf;
  --safe: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-text-size-adjust:100%}
a{color:var(--focus)}
button,select,.chip{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
h1,h2{text-wrap:balance}
.skip{position:absolute;left:-9999px;top:0;background:var(--panel2);color:var(--fg);
  padding:10px 14px;border-radius:0 0 10px 0;z-index:40;font-size:13px}
.skip:focus{left:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
body{
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC",system-ui,sans-serif;
  padding-bottom:0;
}
header{
  position:sticky;top:0;z-index:20;background:rgba(13,17,23,.92);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);
  padding:10px 14px 8px;
}
header .hrow{max-width:760px;margin:0 auto}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:17px;margin:0;letter-spacing:.02em}
.tag{font-size:11px;color:var(--dim);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border-radius:999px;
  border:1px solid var(--line);color:var(--dim);background:var(--panel)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
nav{position:sticky;top:var(--headh);z-index:19;background:var(--bg);
  border-bottom:1px solid var(--line);padding:6px 10px;}
.navwrap{max-width:760px;margin:0 auto;display:flex;gap:4px}
nav button{
  flex:1;background:transparent;border:0;color:var(--dim);font:inherit;font-size:13px;
  padding:10px 4px;border-radius:9px;cursor:pointer;min-height:44px;
}
nav button:hover{background:var(--panel2);color:var(--fg)}
nav button[aria-selected="true"]{background:var(--panel2);color:var(--fg);font-weight:600}
main{padding:12px 12px calc(24px + var(--safe));max-width:760px;margin:0 auto}
section{display:none}
section.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:8px}
.card h2{font-size:12px;color:var(--dim);margin:0 0 10px;font-weight:600;letter-spacing:.04em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.rgrid{grid-template-columns:1fr}}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:359px){.grid3{grid-template-columns:1fr 1fr}}
@media (min-width:600px){.grid3 .kpi .v{font-size:17px}}
.grid3 .kpi{padding:8px 9px}
.grid3 .kpi .k{font-size:10px}
.grid3 .kpi .v{font-size:15px}
.grid3 .kpi .s{font-size:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 11px;min-width:0}
.kpi.tap{cursor:pointer;transition:border-color .15s,background .15s}
.kpi.tap:hover{border-color:#3d5a7a;background:#182029}
.kpi.tap:active{background:#1b232d}
.kpi .chev{float:right;color:var(--dim2);font-weight:600}
.kpi:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.kpi .v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k{font-size:11px;color:var(--dim);display:flex;justify-content:space-between;align-items:center}
.kpi .v{font-size:18px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:3px}
.kpi .s{font-size:11px;color:var(--dim2);margin-top:2px}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--dim)}
.warn{background:#3a2a10;border:1px solid #6b4a12;color:#ffc266;border-radius:12px;padding:10px;font-size:12.5px;margin-bottom:10px}
.order{border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-bottom:8px;background:var(--panel2)}
.ohead{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.onums{font-size:12px;color:var(--dim);margin-top:2px;font-variant-numeric:tabular-nums}
.oreason{font-size:11.5px;color:#b9c5d2;margin-top:5px;line-height:1.45}
.minirow{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #1f2732;font-size:13px;font-variant-numeric:tabular-nums}
.minirow:last-child{border-bottom:0}
.minirow b{color:#eaf0f6}
.rows{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #1f2732;font-size:13px}
.rows:last-child{border-bottom:0}
.rows .k{color:var(--dim)}
.rows .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);color:#c8d4e0;
  border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:11.5px;cursor:pointer;
  min-height:32px;font-family:inherit}
.chip:hover{border-color:#3d5a7a}
.chip:active{background:#243242}
.chip.on{background:#223143;color:#fff;border-color:#39506a}
.chip.off{opacity:.4}
.chip b{font-weight:400;color:#7d8c9c}
select{background:var(--panel2);color:#c8d4e0;border:1px solid var(--line);border-radius:999px;
  padding:7px 26px 7px 10px;font:inherit;font-size:11.5px;max-width:150px;min-height:32px;
  appearance:none;-webkit-appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238b9aab' stroke-width='1.6' fill='none'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 9px center}
select:hover{border-color:#3d5a7a}
.hint{font-size:11px;color:var(--dim2);display:inline-block;margin-top:4px}
svg{display:block;width:100%;height:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:right;padding:7px 4px;border-bottom:1px solid #1f2732;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
td .hint{display:block}
th{color:var(--dim);font-size:11px;font-weight:600}
td{font-variant-numeric:tabular-nums}
.empty{border:1px dashed #2b3542;border-radius:12px;padding:16px;text-align:center;color:var(--dim);font-size:13px}
.foot{color:var(--dim2);font-size:11px;line-height:1.6;margin-top:8px}
.decision .act{font-size:18px;font-weight:700}
.trade{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--panel2)}
.thead{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.tnums{font-size:12.5px;margin-top:3px;font-variant-numeric:tabular-nums}
.tfees{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.treason{font-size:11px;color:#b9c5d2;margin-top:4px}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;margin:12px 0 4px;background:#1b232d}
.bar i{display:block;height:100%}
.hold{border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-bottom:8px;background:var(--panel2)}
.hmain{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.hsub{font-size:11.5px;color:var(--dim);margin-top:2px;font-variant-numeric:tabular-nums}
.hrow{display:flex;justify-content:space-between;font-size:12.5px;margin-top:6px;font-variant-numeric:tabular-nums}
.hrow2{display:grid;grid-template-columns:1.15fr .55fr .7fr .7fr .95fr .95fr;gap:4px;align-items:center;
  padding:8px 2px;border-bottom:1px solid #1f2732;font-size:12px;font-variant-numeric:tabular-nums}
.hrow2 span{text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow2 span:first-child{text-align:left}
.hrow2.hhead{color:var(--dim2);font-size:10px;border-bottom:1px solid var(--line)}
.hold .up,.hold .down{font-weight:600}
.path{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}

/* KPI 數值更新時閃一下（視覺確認） */
.kpi.flash{animation:kpiFlash .9s ease-out}
@keyframes kpiFlash{0%{border-color:#22d3ee;box-shadow:0 0 0 1px #22d3ee inset}100%{border-color:var(--line);box-shadow:none}}
</style>
</head>

<script>/* TRADE dashboard — 分頁式前端（無框架、無 CDN） */
(() => {
  const D = window.__DATA__;
  const $ = (s) => document.querySelector(s);
  const el = (id) => document.getElementById(id);
  const money = (n) => (n == null ? '—' : 'HK$' + Math.round(n).toLocaleString());
  const pct = (x) => (x == null ? '—' : (x >= 0 ? '+' : '') + (x * 100).toFixed(2) + '%');
  const cls = (x) => (x > 0.0005 ? 'up' : x < -0.0005 ? 'down' : 'flat');
  const COLORS = ['#60a5fa', '#34d399', '#fbbf24', '#f87171', '#a78bfa', '#2dd4bf'];
  const store = {
    get() { try { return JSON.parse(localStorage.getItem('tradeChart') || '{}'); } catch { return {}; } },
    set(v) { try { localStorage.setItem('tradeChart', JSON.stringify(v)); } catch (e) {} },
  };

  /* ---------- 頭部 ---------- */
  const QH = D.quoteHealth;
  const live = !!(QH && (QH.HK?.fresh || QH.US?.fresh));
  const anySessionOpen = Object.values(D.session ?? {}).some((v) => v === true);
  el('headPill').innerHTML = D.halt
    ? `<span class="dot" style="background:var(--down)"></span>已停機`
    : `<span class="dot" style="background:${live ? 'var(--up)' : 'var(--dim2)'}"></span>` +
    (D.halt ? '' : (anySessionOpen ? '開市' : '休市'));
  const builtHM = new Date(D.builtAt).toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit' });
  el('headTag').textContent = (D.preview ? '預覽 ' : `${(D.seriesAll ?? D.series).length} 隻 · `) +
    (() => {
      const bd = new Date(D.barsFetchedAt);
      const day = isNaN(bd.getTime()) ? '—' : bd.toLocaleDateString('zh-HK', { month: 'long', day: 'numeric' });
      return `日線 ${day} · 建於 ${builtHM}`;
    })();
  if (D.preview) el('previewBar').innerHTML = '<div class="warn">🧪 預覽模式：交易同曲線係示範數據，真數據睇 dashboard.html</div>';

  /* ---------- 分頁 ---------- */
  const tabs = ['overview', 'positions', 'charts', 'screen', 'research'];
  function showTab(name, push = true) {
    if (!tabs.includes(name)) name = 'overview';
    tabs.forEach((t) => {
      const on = t === name;
      el('tab-' + t).classList.toggle('on', on);
      const b = el('nav-' + t);
      b.setAttribute('aria-selected', String(on));
      b.tabIndex = on ? 0 : -1;
    });
    store.set({ ...store.get(), tab: name });
    if (push && location.hash.slice(1) !== name) history.replaceState(null, '', '#' + name);
    window.scrollTo({ top: 0 });
  }
  tabs.forEach((t) => el('nav-' + t).addEventListener('click', () => showTab(t)));
  // 方向鍵／Home／End 喺 tabs 之間移動（WAI-ARIA tab pattern）
  el('nav-overview').parentElement.addEventListener('keydown', (e) => {
    const i = tabs.indexOf(location.hash.slice(1) || 'overview');
    let j = null;
    if (e.key === 'ArrowRight') j = (i + 1) % tabs.length;
    else if (e.key === 'ArrowLeft') j = (i - 1 + tabs.length) % tabs.length;
    else if (e.key === 'Home') j = 0;
    else if (e.key === 'End') j = tabs.length - 1;
    if (j == null) return;
    e.preventDefault();
    showTab(tabs[j]);
    el('nav-' + tabs[j]).focus();
  });
  window.addEventListener('hashchange', () => showTab(location.hash.slice(1) || 'overview', false));

  /* ---------- 總覽 ---------- */
  const LR = D.lanes.R, LT = D.lanes.T, LA = D.lanes.A;
  const todayStr = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Hong_Kong' });
  const todayFills = (D.trades || []).filter((x) => String(x.fill?.ts ?? x.ts_decision ?? '').slice(0, 10) === todayStr ||
    (x.fill?.ts && new Date(x.fill.ts).toLocaleDateString('sv-SE', { timeZone: 'Asia/Hong_Kong' }) === todayStr)).length;

  const LM = D.lanes.M, LX = D.lanes.X, LB = D.lanes.B, LE = D.lanes.E;
  const retStr = (l) => (l.totalReturn >= 0 ? '+' : '') + l.totalReturn + '%';
  el('kpiGrid').innerHTML = [
    { k: 'R 保守', v: money(LR.equity), s: retStr(LR), c: 'var(--amber)', go: 'R' },
    { k: 'M 平衡', v: money(LM.equity), s: retStr(LM), c: 'var(--blue)', go: 'M' },
    { k: 'X 進取', v: money(LX.equity), s: retStr(LX), c: 'var(--down)', go: 'X' },
    { k: 'T 低注', v: money(LT.equity), s: LT.lastAt ? '更新 ' + new Date(LT.lastAt).toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit' }) : '等開市', c: 'var(--teal)', go: 'T' },
    { k: 'A AI', v: money(LA.equity), s: LA.decision ? ({ buy: '買入', sell: '賣出', hold: '觀望' }[LA.decision.action] ?? LA.decision.action) : '未開鐘', c: 'var(--violet)', go: 'A' },
    { k: 'T2 收息', v: money(D.lanes.T2?.equity), s: D.lanes.T2 ? retStr(D.lanes.T2) : '—', c: '#22d3ee', go: 'T2' },
    { k: 'B 等權', v: money(LB?.equity), s: LB ? retStr(LB) : '—', c: '#f472b6', go: 'B' },
    { k: 'E ETF', v: money(LE?.equity), s: LE ? retStr(LE) : '—', c: '#a3e635', go: 'E' },
    // 等權基準／今日成交已移除（2026-10-28 用戶要求）；等權基準喺圖表頁、成交喺組合頁 */}

  ].map((x) => `<div class="kpi${x.go ? ' tap' : ''}" ${x.go ? `data-go="${x.go}" role="button" tabindex="0" aria-label="${x.k}：睇詳情"` : ''}>
      <div class="k"><span>${x.k}</span><i class="dot" style="background:${x.c}"></i></div>
      <div class="v">${x.v}</div><div class="s">${x.s}${x.go ? ' <span class="chev">›</span>' : ''}</div></div>`).join('');

  function goTo(v) {
    if (v === 'charts') return showTab(v);
    if (v === 'log') { showTab('overview'); setTimeout(() => el('todayBlock')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60); return; }
    posLane = v;
    store.set({ ...store.get(), posLane: v });
    drawPortfolio();
    showTab('positions');
    setTimeout(() => { const h = el('holdings'); if (h) h.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 80);
  }
  el('kpiGrid').querySelectorAll('[data-go]').forEach((n) => {
    n.addEventListener('click', () => goTo(n.dataset.go));
    n.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goTo(n.dataset.go); } });
  });

  const haltBanner = D.halt
    ? `<div class="warn" style="border-color:#7f1d1d">⛔ 已停機（HALT）：${D.halt.reason ?? ''}｜來源 ${D.halt.source ?? '—'}｜<code>node scripts/halt.mjs off</code> 解除</div>`
    : '';
  const blocked = (LR.blocked || []);
  el('todayBlock').innerHTML =
    haltBanner +
    (blocked.length ? blocked.map((b) => `<div class="warn">🚧 ${b.reason}</div>`).join('') : '') +
    (() => {
      const all = [];
      for (const k of ['R', 'M', 'X']) for (const o of (D.lanes[k].pending || [])) all.push({ ...o, lane: k });
      return all.length
        ? `<div class="card"><h2>今日待成交（下一個交易日開市）</h2>` +
          all.slice(0, 9).map((o) => `<div class="minirow"><span><b>${o.lane}</b> · ${o.action === 'buy' ? '買' : '賣'} ${o.sym}</span>
              <span>${o.qty} 股 · ${money(o.notional_hkd)}</span></div>`).join('') +
          '</div>'
        : '<div class="card"><div class="empty">今日冇新訂單</div></div>';
    })();

  const qhLabel = (q) => {
    if (!q) return { v: '—', i: '·' };
    if (q.fresh && q.delayed) return { v: `${Math.round(q.lag_s / 60)} 分鐘延遲`, i: '🐢' };
    if (q.fresh) return { v: `${q.lag_s}s`, i: '✅' };
    if (q.lag_s == null) return { v: '冇時間', i: '❓' };
    if (q.lag_s > 3600) return { v: '休市', i: '🌙' };
    return { v: `${q.lag_s}s`, i: '⚠️' };
  };
  el('quoteHealth').innerHTML = QH
    ? (() => {
      const hk = qhLabel(QH.HK), us = qhLabel(QH.US);
      return `<div class="minirow"><span>港股 ${hk.v} ${hk.i} <i class="hint">${QH.HK?.src ?? ''}</i></span>
         <span>美股 ${us.v} ${us.i} <i class="hint">${QH.US?.src ?? ''}</i></span></div>
       <div class="hint">更新 ${new Date(QH.at).toLocaleTimeString('zh-HK')}　·　美股 > 300 秒、港股 > 600 秒會拒絕交易${
         QH.HK?.delayed ? '；港股而家係延遲價（成交已加 20bps 滑價）' : ''}</div>`;
    })()
    : '<div class="empty">Lane T 未啟動</div>';

  /* ---------- 風險監察 ---------- */
  const RK = D.risk;
  if (RK) {
    el('riskBox').innerHTML = `<div class="card"><h2>風險監察（組合層）</h2>
      <div class="minirow"><span>總資產</span><span>${money(RK.totalEquity)}（現金 ${RK.cashPct}%）</span></div>
      <div class="minirow"><span>日 VaR95 / CVaR95</span><span class="down">${RK.var95Pct}% / ${RK.cvar95Pct}%</span></div>
      <div class="minirow"><span>主動 lane 平均 IR</span><span class="${RK.activeAvgIR < 0 ? 'down' : 'up'}">${RK.activeAvgIR}</span></div>
      <div class="hint">${RK.indexCore ? 'IR 為負 → 資金核心用指數；主動 lane 只做紙上監察' : 'IR 未見系統性負值'}</div>
      <div class="foot">更新 ${new Date(RK.generatedAt).toLocaleString('zh-HK', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })}</div>
    </div>`;
  }

  /* ---------- 每日覆盤 ---------- */
  const RV = D.review;
  if (RV) {
    const bad = (RV.flags ?? []).filter((f) => f.sev === 'blocker');
    const warn = (RV.flags ?? []).filter((f) => f.sev === 'warn');
    el('reviewBox').innerHTML = `<div class="card"><h2>每日覆盤（執行檢查）</h2>
      <div class="minirow"><span>${RV.date} 成交 ${RV.trades} 筆｜費用 ${money(RV.fees)}</span><span class="${bad.length ? 'down' : warn.length ? '' : 'up'}">${bad.length ? `🔴 ${RV.flagTotal} 項（含 blocker）` : warn.length ? `⚠️ ${RV.flagTotal ?? warn.length} warn` : '✅ 無異常'}</span></div>
      <div class="minirow"><span>時段外 / 同日重入 / 延遲價</span><span>${RV.offSession} / ${RV.reentries} / ${RV.delayed}</span></div>
      <div class="minirow"><span>滑價中位</span><span>${RV.slipMedianBps ?? '—'} bps</span></div>
      ${(RV.flags ?? []).slice(0, 3).map((f) => `<div class="hint">${f.sev === 'blocker' ? '🔴' : '⚠️'} ${f.msg}</div>`).join('')}
      <div class="foot">只查執行／流程；策略有冇 edge 要睇月度 IR／walkforward</div></div>`;
  }

  /* ---------- 研報 ---------- */
  const RS = D.research;
  const stanceOf = (s) => ({ bullish: ['看好', 'up'], bearish: ['看淡', 'down'], neutral: ['中性', 'flat'] }[s] ?? ['中性', 'flat']);
  if (!RS) {
    el('researchBox').innerHTML = '<div class="card"><h2>AI 研報</h2><div class="empty">未跑過研報。<br><span style="font-size:11px">node scripts/research.mjs --commit</span></div></div>';
  } else {
    const card = (r) => {
      const [lbl, cls] = stanceOf(r.stance);
      const ev = (r.evidence || []).slice(0, 6).map((e) =>
        `<a href="${e.url}" target="_blank" rel="noopener" style="display:inline-block;margin:2px 6px 2px 0;font-size:11px">${e.title}</a>`).join('');
      const li = (arr, c) => (arr || []).map((x) => `<li class="${c}" style="margin:3px 0">${x}</li>`).join('');
      return `<div class="card">
        <div class="thead"><b>${r.sym}</b><span class="chip ${cls}" style="cursor:default">${lbl} ${(r.confidence * 100).toFixed(0)}%</span></div>
        <div class="hsub">${r.name ?? ''} · ${r.asOf}</div>
        <p style="margin:8px 0 6px;font-size:13.5px;line-height:1.55">${r.one_liner}</p>
        <div class="rgrid">
          <div><div class="hint" style="margin:0 0 3px">利多</div><ul style="margin:0;padding-left:16px;font-size:12px;line-height:1.5">${li(r.bull)}</ul></div>
          <div><div class="hint" style="margin:0 0 3px">利淡</div><ul style="margin:0;padding-left:16px;font-size:12px;line-height:1.5">${li(r.bear)}</ul></div>
        </div>
        ${r.catalysts?.length ? `<div class="hint" style="margin-top:8px">催化劑　${r.catalysts.map((x) => `<span class="chip" style="cursor:default">${x}</span>`).join(' ')}</div>` : ''}
        <div class="hint" style="margin-top:6px">風險　${(r.risks || []).join('；') || '—'}</div>
        ${r.valuation ? `<div class="hint" style="margin-top:6px">估值　${
          r.valuation.pe != null ? `P/E ${r.valuation.pe.toFixed(1)}` : 'P/E —'}${
          r.valuation.earningsYield != null ? ` · 盈利收益率 ${(r.valuation.earningsYield * 100).toFixed(2)}%` : ''}${
          r.valuation.pb != null ? ` · P/B ${r.valuation.pb.toFixed(1)}` : ''}${
          r.valuation.growthPct != null ? ` · EPS 增長 ${r.valuation.growthPct.toFixed(1)}%` : ''}${
          r.valuation.pePct != null ? ` · 歷史百分位 ${r.valuation.pePct.toFixed(0)}%` : ''}</div>` : ''}
        <div class="hint" style="margin-top:6px">證據　${ev || '—'}</div>
        <div class="foot">${r.priceCtx ? `60 日 ${r.priceCtx.ret60}% · 距 MA200 ${r.priceCtx.ma200Dist}% · ATR ${r.priceCtx.atrPct}%` : ''}
          ${r.tokens ? ` · ${r.tokens} tokens` : ''}${r.latencyMs ? ` · ${(r.latencyMs / 1000).toFixed(1)}s` : ''}</div>
      </div>`;
    };
    el('researchBox').innerHTML =
      `<div class="card"><h2>AI 研報（研究假設）</h2>
        <div class="hint" style="margin:0">${RS.disclaimer ?? '研究假設，唔係交易訊號'}　·　${RS.counts?.symbols ?? 0} 隻 · ${RS.model ?? ''} · 跑於 ${new Date(RS.generatedAt).toLocaleString('zh-HK', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })}</div>
        <div class="hint" style="margin-top:6px">來源：10-K／10-Q／8-K（SEC）、XBRL 財務、HKEX 公告、Google News 標題。
        研究閘 <b>${D.research.gate ?? 'shadow'}</b>${(D.research.gate ?? 'shadow') === 'shadow' ? '：只記錄「會唔會擋」，唔改落單' : '：bearish 且信心 ≥55% 會擋入場'}。</div>
      </div>` +
      RS.records.map(card).join('');
  }

  /* ---------- 候選 ---------- */
  const SC = D.screen;
  el('screenBox').innerHTML = !SC
    ? '<div class="card"><div class="empty">未跑過 screen（node scripts/screen.mjs）</div></div>'
    : `<div class="card">
         <h2>機械化候選池</h2>
         <div class="minirow"><span>候選池</span><span>美股 ${SC.universe.us}、港股 ${SC.universe.hk}</span></div>
         <div class="minirow"><span>通過篩選</span><span><b>${SC.passed}</b> 隻</span></div>
         <div class="minirow"><span>新入選（對比上次）</span><span>${SC.newEntrants.length ? SC.newEntrants.slice(0, 6).join(', ') : '—'}</span></div>
         <div class="hint">規則：≥220 根日線、close>MA200、ATR<8%、成交額門檻（US$30M／HK$50M）、按 60 日回報排名<br>更新：${new Date(SC.generatedAt).toLocaleString('zh-HK')}</div>
       </div>
       ${['US', 'HK'].map((mkt) => {
         const list = SC.candidates.filter((c) => c.market === mkt).slice(0, mkt === 'US' ? 12 : 10);
         return `<div class="card"><h2>${mkt === 'US' ? '美股' : '港股'} Top ${list.length}</h2>
           <div class="hrow2 hhead"><span>標的</span><span>#</span><span>60日</span><span>20日</span><span>ATR</span><span>成交額</span></div>
           ${list.length ? list.map((c) => `<div class="hrow2">
              <span><b>${c.sym}</b>${c.market === 'HK' && c.tradeable === false ? '<i class="hint" style="display:block">未核實每手</i>' : ''}</span>
              <span>${c.rank}</span>
              <span class="${c.ret60 > 0 ? 'up' : 'down'}">${c.ret60}%</span>
              <span class="${c.ret20 > 0 ? 'up' : 'down'}">${c.ret20}%</span>
              <span>${c.atr_pct}%</span>
              <span>${c.turnover_m}M</span>
            </div>`).join('') : '<div class="empty">冇港股通過篩選</div>'}
         </div>`;
       }).join('')}`;
  if (SC) {
    // 加去 6 欄 grid 唔夠位，改用簡單列表（已用 hrow2）
  }

  /* ---------- 組合 ---------- */
  let posLane = store.get().posLane || 'R';
  let lastLiveState = null;
  const fmtSigned = (n, suffix = '') => (n == null ? '—' : (n >= 0 ? '+' : '') + Math.round(n).toLocaleString() + suffix);

  function drawPortfolio() {
    const L = D.lanes[posLane];
    const sw = el('laneSwitch');
    sw.innerHTML = ['R', 'M', 'X', 'T', 'A', 'B', 'E', 'T2'].filter((k) => D.lanes[k]).map((k) => {
      const on = k === posLane;
      return `<button class="chip ${on ? 'on' : 'off'}" data-lane="${k}">Lane ${k}</button>`;
    }).join('');
    const meta = (D.laneMeta || {})[posLane];
    if (meta) {
      const chips = [meta.label];
      if (meta.risk != null) chips.push(`風險 ${meta.risk}%`, `上限 ${meta.cap}%`, `剎停 ${meta.dd}%`);
      if (meta.strategy) chips.push(meta.strategy === 'buyhold' ? '每月 rebalance' : 'MA200 進出');
      else chips.push(`排名 ${meta.rankK ? '前 ' + meta.rankK : '全部'}`);
      chips.push(meta.exec === 'live' ? '即時成交' : '下一開市');
      el('laneInfo').innerHTML = chips
        .map((x) => `<span class="chip" style="padding:3px 8px;margin:2px 4px 2px 0;font-size:11px">${x}</span>`).join('');
      const uni = meta.universe || [];
      const uniTotal = meta.universeCount ?? uni.length;
      const show = uni.slice(0, 24);
      el('laneUniverse').innerHTML = '成分：' + show.map((x) => `<span class="chip" style="padding:3px 7px;margin:2px 4px 2px 0;font-size:10.5px">${x}</span>`).join('') +
        (uniTotal > show.length ? `<span class="chip" style="padding:3px 7px;margin:2px 0;font-size:10.5px">…共 ${uniTotal} 隻</span>` : '');
    }
    sw.querySelectorAll('[data-lane]').forEach((b) => b.onclick = () => {
      posLane = b.dataset.lane;
      store.set({ ...store.get(), posLane });
      drawPortfolio();
    });

    const pnlCls = (n) => (n > 0.005 ? 'up' : n < -0.005 ? 'down' : 'flat');
    el('posSummary').innerHTML = [
      { k: '總資產', v: money(L.equity), s: `總回報 ${L.totalReturn >= 0 ? '+' : ''}${L.totalReturn}%`, c: pnlCls(L.totalReturn) },
      { k: '可用現金', v: money(L.cash), s: `佔 ${L.cash_pct}%`, c: '' },
      { k: '持倉市值', v: money(L.mv_hkd), s: `${L.positions.length} 隻 · 成本 ${money(L.cost_hkd)}`, c: '' },
      { k: '未實現盈虧', v: fmtSigned(L.unrealized), s: `${L.unrealized_pct >= 0 ? '+' : ''}${L.unrealized_pct}%`, c: pnlCls(L.unrealized) },
      { k: '已實現盈虧', v: fmtSigned(L.realized), s: `已扣費用 ${money(L.feesTotal)}`, c: pnlCls(L.realized) },
      { k: '回撤', v: `${L.dd_pct}%`, s: '由最高點計', c: pnlCls(L.dd_pct) },
    ].map((x) => `<div class="kpi"><div class="k">${x.k}</div>
        <div class="v ${x.c}">${x.v}</div><div class="s">${x.s}</div></div>`).join('');

    // 資產分佈條
    const segs = [{ label: '現金', pct: L.cash_pct, color: '#3d4b5b' }]
      .concat(L.positions.map((p, i) => ({ label: p.sym, pct: p.weight, color: ['#fbbf24', '#a78bfa', '#2dd4bf', '#60a5fa', '#f87171', '#34d399'][i % 6] })));
    el('posBar').innerHTML = segs.map((x) => `<i style="width:${Math.max(0, x.pct)}%;background:${x.color}"></i>`).join('');

    // 持倉明細（手機：每個持倉一張卡）
    el('holdings').innerHTML = L.positions.length
      ? L.positions.map((p) => `<div class="hold" data-sym="${p.sym}" data-qty="${p.qty}" data-entry="${p.entry}" data-cur="${p.currency}">
          <div class="hmain"><b>${p.sym}</b><span class="pill">${p.weight}%</span></div>
          <div class="hsub">${p.qty} 股 · 成本 ${p.entry} · 現價 ${p.last}</div>
          <div class="hrow"><span>市值 ${money(p.mv_hkd)}</span>
            <span class="${pnlCls(p.pnl)}">${fmtSigned(p.pnl)}（${p.pnl_pct >= 0 ? '+' : ''}${p.pnl_pct}%）</span></div>
        </div>`).join('')
      : '<div class="empty">而家空倉（100% 現金）。<br><span style="font-size:11px">成交後呢度會列持倉、成本、盈虧。</span></div>';

    el('pendingBox').innerHTML = (L.pending && L.pending.length)
      ? L.pending.map((o) => `<div class="order"><div class="ohead"><b>${o.action === 'buy' ? '買入' : '賣出'} ${o.sym}</b>
          <span class="pill">${o.qty} 股</span></div>
          <div class="onums">參考 ${o.ref_px}${o.notional_hkd ? ' · ' + money(o.notional_hkd) + '（' + o.weight_pct + '%）' : ''}</div>
          <div class="oreason">${o.reason || ''}</div></div>`).join('')
      : '<div class="empty">冇待成交訂單</div>';

    const OV = D.overlap || [];
    el('overlapBox').innerHTML = OV.length
      ? OV.map((o) => `<div class="minirow"><span><b>${o.sym}</b> ×${o.lanes.length} 條線（${o.lanes.map((x) => x.lane).join('/')}）</span>
          <span>合計權重 ${o.totalWeight}%</span></div>`).join('') +
        '<div class="hint">同一隻股喺多條 lane 出現 = 疊加曝險，唔係分散。</div>'
      : '<div class="empty">暫時冇持倉重疊（全部空倉）</div>';

    // 本 lane 成交紀錄（最新 40 筆）
    const ltr = (L.trades || []).slice().sort((a, b) => String(b.fill?.ts ?? b.ts ?? '').localeCompare(String(a.fill?.ts ?? a.ts ?? ''))).slice(0, 40);
    const feeSum = (L.trades || []).reduce((a, t) => a + (t.fees?.total_hkd ?? 0), 0);
    const trTotal = L.tradesTotal ?? (L.trades || []).length;
    el('laneTrades').innerHTML = ltr.length
      ? `<div class="hint" style="margin-bottom:6px">共 ${trTotal} 筆（顯示最新 ${ltr.length}）｜累計費用 ${money(feeSum)}</div>` +
        ltr.map((t) => `<div class="trade"><div class="thead"><b>${t.side === 'buy' ? '買入' : '賣出'} ${t.sym}${t.fill?.delayed ? ' <span class="chip" style="cursor:default;padding:2px 6px;font-size:10px">延遲價</span>' : ''}</b>
          <span class="pill">${(t.fill?.ts || t.ts || '').slice(5, 16).replace('T', ' ')}</span></div>
          <div class="tnums">${t.qty} 股 @ ${t.fill?.px ?? '—'} · ${money(t.notional_hkd)}</div>
          <div class="tfees">費用 ${money(t.fees?.total_hkd)} · 滑價 ${t.fill?.slip_bps ?? '—'}bps</div>
          <div class="treason">${(t.reason || '').slice(0, 110)}</div></div>`).join('')
      : '<div class="empty">本 lane 未有成交。</div>';

    el('decisionCard').style.display = (posLane === 'A' && LA.decision) ? 'block' : 'none';
    el('decisionBox').innerHTML = posLane === 'A' && LA.decision
      ? `<div class="decision"><div class="rows"><span class="k">最新動作</span><span class="v act">${LA.decision.action} ${LA.decision.symbol || ''} ${LA.decision.qty || ''}</span></div>
         <div class="rows"><span class="k">信心</span><span class="v">${LA.decision.confidence}</span></div>
         <p style="font-size:13px;line-height:1.6;margin:10px 0 6px"><b>理由：</b>${LA.decision.reason}</p>
         <p style="font-size:12px;color:var(--dim);line-height:1.6;margin:0"><b>失效條件：</b>${LA.decision.invalidation}</p>
         <div class="hint">決策者：${LA.decider || '—'}</div></div>`
      : '';
    if (lastLiveState) applyLivePortfolio(lastLiveState);
  }

  el('positionsBox').innerHTML =
    `<div class="card"><div class="legend" id="laneSwitch" style="margin:0 0 10px"></div>
       <div class="grid2" id="posSummary"></div>
       <div class="bar" id="posBar"></div>
       <div class="hint" id="laneInfo" style="margin-bottom:4px"></div>
       <div class="hint" id="laneUniverse" style="margin-bottom:6px;line-height:2"></div>
       <div class="hint">資產分佈（現金＋持倉權重）</div>
     </div>
     <div class="card"><h2>持倉明細</h2><div id="holdings"></div></div>
     <div class="card"><h2>成交紀錄（本 lane）</h2><div id="laneTrades"></div></div>
     <div class="card"><h2>待成交訂單</h2><div id="pendingBox"></div></div>
     <div class="card"><h2>跨 lane 重疊</h2><div id="overlapBox"></div></div>
     <div class="card" id="decisionCard" style="display:none"><h2>Lane A 最新決定</h2><div id="decisionBox"></div></div>`;

  drawPortfolio();


  /* ---------- 圖表 ---------- */
  const PX_ALL = [...D.series.map((s) => ({ k: s.sym, pts: s.pts })), { k: '中位數', pts: D.equalWeight.pts }];
  const saved = store.get();
  let priceVisible = Array.isArray(saved.price) && saved.price.length
    ? saved.price.map((k) => (k === '等權' ? '中位數' : k))
    : ['2800.HK', 'SPY', '中位數'];
  let eqVisible = Array.isArray(saved.eq) && saved.eq.length ? saved.eq : ['R', 'A', 'T'];
  const persist = () => store.set({ ...store.get(), price: priceVisible, eq: eqVisible });

  const axis = (min, max, W, H, P) => {
    let g = '';
    for (let i = 0; i <= 3; i++) {
      const v = min + (max - min) * i / 3;
      const y = H - P - (v - min) / ((max - min) || 1) * (H - 2 * P);
      g += `<line x1="${P}" y1="${y}" x2="${W - P}" y2="${y}" stroke="#26303b"/>`;
      g += `<text x="${W - P}" y="${y - 3}" fill="#8593a6" font-size="10" text-anchor="end">${Math.round(v).toLocaleString()}</text>`;
    }
    return g;
  };

  function drawPrice() {
    const sel = PX_ALL.filter((s) => priceVisible.includes(s.k));
    const box = el('priceChart'), leg = el('priceLegend');
    if (!sel.length) { box.innerHTML = ''; leg.innerHTML = '<span class="hint">未揀線</span>'; return; }
    const W = 340, H = 190, P = 10;
    const all = sel.flatMap((s) => s.pts.map((p) => p[1]));
    const min = Math.min(100, ...all) * 0.98, max = Math.max(...all) * 1.02;
    const t0 = Math.min(...sel.map((s) => s.pts[0][0])), t1 = Math.max(...sel.map((s) => s.pts.at(-1)[0]));
    const X = (t) => P + (t - t0) / ((t1 - t0) || 1) * (W - 2 * P);
    const Y = (v) => H - P - (v - min) / ((max - min) || 1) * (H - 2 * P);
    let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="相對表現圖：${sel.map((x) => x.k).join('、')}，起點 100">` + axis(min, max, W, H, P);
    svg += `<line x1="${P}" y1="${Y(100)}" x2="${W - P}" y2="${Y(100)}" stroke="#3d4b5b" stroke-dasharray="3 3"/>`;
    sel.forEach((s) => {
      const c = COLORS[PX_ALL.findIndex((x) => x.k === s.k) % COLORS.length];
      svg += `<path class="path" d="${s.pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ')}" stroke="${c}"/>`;
    });
    svg += `<text x="${P}" y="${H - 2}" fill="#8593a6" font-size="10">${new Date(t0).toLocaleDateString('zh-HK', { year: 'numeric', month: '2-digit' })}</text>`;
    svg += `<text x="${W - P}" y="${H - 2}" fill="#8593a6" font-size="10" text-anchor="end">${new Date(t1).toLocaleDateString('zh-HK', { year: 'numeric', month: '2-digit' })}</text></svg>`;
    box.innerHTML = svg;

    const rest = PX_ALL.filter((s) => !priceVisible.includes(s.k));
    leg.innerHTML = sel.map((s) => {
      const c = COLORS[PX_ALL.findIndex((x) => x.k === s.k) % COLORS.length];
      return `<button class="chip on" data-p="${s.k}"><i class="dot" style="background:${c}"></i>${s.k}<b>×</b></button>`;
    }).join('') +
      (rest.length ? `<select id="addP" aria-label="加一條標的線"><option value="">＋ 加線</option>${rest.map((s) => `<option value="${s.k}">${s.k}</option>`).join('')}</select>` : '');
    leg.querySelectorAll('[data-p]').forEach((b) => b.onclick = () => {
      priceVisible = priceVisible.filter((k) => k !== b.dataset.p); persist(); drawPrice();
    });
    const addP = el('addP');
    if (addP) addP.onchange = (e) => { if (e.target.value) { priceVisible = [...priceVisible, e.target.value]; persist(); drawPrice(); } };
  }

  function drawEquity() {
    const EQ = D.equitySeries || { R: [], A: [], T: [] };
    const ALL = [['R', 'var(--amber)'], ['M', 'var(--blue)'], ['X', 'var(--down)'], ['A', 'var(--violet)'], ['T', 'var(--teal)'],
      ['B', '#f472b6'], ['E', '#a3e635']];
    const box = el('eqChart');
    const sel = ALL.filter(([k]) => eqVisible.includes(k));
    const pts = sel.flatMap(([k]) => (EQ[k] || []).filter((p) => Number.isFinite(p[1])));
    const hasLine = sel.some(([k]) => (EQ[k] || []).filter((q) => Number.isFinite(q[1])).length >= 2);
    let html = '';
    if (pts.length >= 2 && hasLine) {
      const W = 340, H = 140, P = 10;
      const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
      const x0 = Math.min(...xs), x1 = Math.max(...xs);
      const y0 = Math.min(...ys) * 0.999, y1 = Math.max(...ys) * 1.001;
      const X = (t) => P + (t - x0) / ((x1 - x0) || 1) * (W - 2 * P);
      const Y = (v) => H - P - (v - y0) / ((y1 - y0) || 1) * (H - 2 * P);
      let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="權益曲線（港元）">` + axis(y0, y1, W, H, P);
      sel.forEach(([k, c]) => {
        const p = (EQ[k] || []).filter((q) => Number.isFinite(q[1]));
        if (p.length < 2) return;
        svg += `<path class="path" d="${p.map((q, i) => (i ? 'L' : 'M') + X(q[0]).toFixed(1) + ' ' + Y(q[1]).toFixed(1)).join(' ')}" stroke="${c}"/>`;
      });
      html = svg + '</svg>';
    } else {
      html = '<div class="empty">Live 由下一個開市日開始記錄。<br><span style="font-size:11px">回測曲線見下面（圖表頁）。</span></div>';
    }
    html += '<div class="legend">' + ALL.map(([k, c]) => {
      const last = (EQ[k] || []).at(-1)?.[1];
      const on = eqVisible.includes(k);
      return `<button class="chip ${on ? 'on' : 'off'}" data-e="${k}"><i class="dot" style="background:${c}"></i>Lane ${k} ${last ? money(last) : '—'}</button>`;
    }).join('') + '</div>';
    box.innerHTML = html;
    box.querySelectorAll('[data-e]').forEach((b) => b.onclick = () => {
      const k = b.dataset.e;
      eqVisible = eqVisible.includes(k) ? eqVisible.filter((x) => x !== k) : [...eqVisible, k];
      persist(); drawEquity();
    });
  }

  /* ---------- 回測對照（v4：R/M/X/T + 基準 lane B/E） ---------- */
  function drawBacktest() {
    const BT = D.backtest;
    if (!BT) return;
    const box = el('btBox');
    if (box) {
      const rows = ['R', 'M', 'X', 'T', 'B', 'E'].filter((k) => BT.lanes?.[k]);
      box.innerHTML = '<table aria-label="回測對照（10 年，含股息、美股 30% 預扣）"><tr><th scope="col">Lane</th><th scope="col">10 年回報</th><th scope="col">最大回撤</th><th scope="col">Sharpe</th></tr>' +
        rows.map((k) => {
          const x = BT.lanes[k];
          return '<tr><td>' + k + ' · ' + x.label +
            '<div class="hint">CAGR ' + (x.cagr ?? '—') + '% · 交易 ' + (x.trades ?? 0).toLocaleString() +
              (x.ir != null ? ' · IR ' + x.ir : '') + (x.var95 != null ? ' · VaR95 ' + x.var95 + '%' : '') + '</div></td>' +
            '<td class="' + cls((x.totalReturn ?? 0) / 100) + '">' + pct((x.totalReturn ?? 0) / 100) + '</td>' +
            '<td class="down">' + (x.maxDD ?? '—') + '%</td>' +
            '<td>' + (x.sharpe ?? '—') + '</td></tr>';
        }).join('') +
        (BT.benchmarks?.SPY != null
          ? '<tr><td>SPY（B&amp;H，含股息）</td><td class="' + cls(BT.benchmarks.SPY / 100) + '">' + pct(BT.benchmarks.SPY / 100) + '</td><td>—</td><td>—</td></tr>'
          : '') +
        '</table><div class="foot">' + (BT.ruleVersion || '') + ' · ' + BT.start + ' → ' + BT.end +
        ' · 排名前 K：' + Object.entries(BT.rankK || {}).map(([k, v]) => k + '=' + (v ?? '全部')).join(' · ') +
        (BT.note ? '<br>' + BT.note : '') +
        (BT.pit ? '<br><b>去 bias 對照</b>（' + BT.pit.note + '）：R ' +
          (BT.pit.R == null ? '—' : (BT.pit.R >= 0 ? '+' : '') + BT.pit.R.toFixed(1) + '%') +
          ' · B ' + (BT.pit.B == null ? '—' : (BT.pit.B >= 0 ? '+' : '') + BT.pit.B.toFixed(1) + '%') + '</div>' : '</div>');
    }
    const chart = el('btChart');
    if (chart) {
      const sets = [['R', 'var(--amber)'], ['B', 'var(--blue)'], ['E', 'var(--teal)']]
        .filter(([k]) => Array.isArray(BT.curves?.[k]) && BT.curves[k].length > 1);
      if (!sets.length) { chart.innerHTML = '<div class="empty">未有回測資料</div>'; return; }
      const pts = sets.flatMap(([k]) => BT.curves[k]);
      const xs = pts.map((x) => x[0]), ys = pts.map((x) => x[1]);
      const W = 340, H = 140, P = 10;
      const x0 = Math.min(...xs), x1 = Math.max(...xs);
      const y0 = Math.min(...ys) * 0.98, y1 = Math.max(...ys) * 1.02;
      const X = (t) => P + (t - x0) / ((x1 - x0) || 1) * (W - 2 * P);
      const Y = (v) => H - P - (v - y0) / ((y1 - y0) || 1) * (H - 2 * P);
      let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="回測權益曲線（R／B／E，10 年）">' + axis(y0, y1, W, H, P);
      sets.forEach(([k, c]) => {
        svg += '<path class="path" d="' + BT.curves[k].map((q, i) => (i ? 'L' : 'M') + X(q[0]).toFixed(1) + ' ' + Y(q[1]).toFixed(1)).join(' ') + '" stroke="' + c + '"/>';
      });
      chart.innerHTML = svg + '</svg><div class="legend">' + sets.map(([k]) => '<span class="chip">Lane ' + k + '</span>').join('') + '</div>';
    }
  }

  /* ---------- 標的統計（圖表頁） ---------- */
  const rows = [...(D.seriesAll ?? D.series)].sort((a, b) => b.stats.ret - a.stats.ret);
  const hkRows = rows.filter((s) => s.sym.endsWith('.HK'));
  const usRows = rows.filter((s) => !s.sym.endsWith('.HK'));
  const table = (list) => '<table><tr><th scope="col">標的</th><th scope="col">最新</th><th scope="col">10 年回報</th><th scope="col">回撤</th><th scope="col">波動</th></tr>' +
    list.map((s) => `<tr><td>${s.sym}</td><td>${s.lastClose.toFixed(2)}</td>
      <td class="${cls(s.stats.ret)}">${pct(s.stats.ret)}</td>
      <td class="down">${pct(s.stats.mdd)}</td><td>${(s.stats.vol * 100).toFixed(0)}%</td></tr>`).join('') + '</table>';
  el('statsBox').innerHTML =
    `<div class="hint" style="margin-bottom:6px">回報用總回報（Yahoo 復權價／Alpaca 用派息重建）。預設收起，襟開睇全部 ${rows.length} 隻。</div>` +
    `<details><summary>美股（${usRows.length}）</summary>${table(usRows)}</details>` +
    `<details><summary>港股（${hkRows.length}）</summary>${table(hkRows)}</details>`;

  /* ---------- 即時金額（讀 docs/share/live-state.json，每 30 秒） ---------- */
  async function pollLive() {
    try {
      const r = await fetch(`live-state.json?t=${Date.now()}`, { cache: 'no-store' });
      if (!r.ok) return;
      const st = await r.json();
      if (!st?.lanes) return;
      lastLiveState = st;
      let n = 0;
      for (const [lane, v] of Object.entries(st.lanes)) {
        const card = document.querySelector(`#kpiGrid .kpi[data-go="${lane}"]`);
        if (!card || v.equity == null) continue;
        const vEl = card.querySelector('.v');
        const sEl = card.querySelector('.s');
        if (vEl) {
          const txt = money(v.equity);
          if (vEl.textContent !== txt && vEl.textContent) {
            card.classList.remove('flash');
            void card.offsetWidth;
            card.classList.add('flash');
          }
          vEl.textContent = txt;
        }
        if (sEl && !sEl.dataset.base) {
          // 保留原始 % 文字，用 equity/100000 計（每條 lane 起始 10 萬）
          sEl.dataset.base = sEl.textContent;
        }
        if (sEl) {
          const pct = (v.equity / 100000 - 1) * 100;
          const chev = sEl.querySelector('.chev');
          sEl.textContent = (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%';
          if (chev) { sEl.appendChild(document.createTextNode(' ')); sEl.appendChild(chev); }
        }
        n++;
      }
      if (location.hash === '#positions') applyLivePortfolio(st);
      if (n) {
        const ageS = (Date.now() - Date.parse(st.at)) / 1000;
        const t = new Date(st.at).toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const tag = el('headTag');
        if (tag) {
          const base = tag.textContent.split(' · ')[0];
          const fresh = ageS < 120;
          tag.textContent = base + (fresh ? ` · ● 即時 ${t}` : ` · ⚠️ 延遲 ${Math.round(ageS / 60)} 分（${t}）`);
          tag.style.color = fresh ? '' : 'var(--amber)';
        }
      }
    } catch { /* 靜靜失敗（file:// 或未部署） */ }
  }
  function applyLivePortfolio(st) {
    const L = D.lanes[posLane];
    const lv = st?.lanes?.[posLane];
    if (!L || !lv) return;
    const fx = st.fx ?? 7.78;
    // 摘要 6 格：總資產 / 現金 / 持倉市值 / 未實現 / 已實現 / 回撤
    const boxes = el('posSummary')?.querySelectorAll('.kpi') ?? [];
    const setBox = (i, v, s2) => {
      const b = boxes[i]; if (!b) return;
      const vEl = b.querySelector('.v'), sEl = b.querySelector('.s');
      if (vEl && v != null) vEl.textContent = v;
      if (sEl && s2 != null) sEl.textContent = s2;
    };
    const totalReturn = (lv.equity / 100000 - 1) * 100;
    setBox(0, money(lv.equity), `總回報 ${totalReturn >= 0 ? '+' : ''}${totalReturn.toFixed(2)}%（即時）`);
    setBox(1, money(lv.cash), lv.equity ? `佔 ${((lv.cash / lv.equity) * 100).toFixed(1)}%` : null);
    setBox(2, money(lv.mv_hkd), null);
    let unreal = 0, cost = 0;
    for (const p of L.positions) { cost += p.cost_hkd ?? 0; }
    unreal = lv.mv_hkd - cost;
    setBox(3, fmtSigned(unreal), `${cost ? ((unreal / cost) * 100).toFixed(2) : '0.00'}%`);
    setBox(5, `${lv.dd_pct?.toFixed(2) ?? '0.00'}%`, '由最高點計（即時）');

    // 持倉卡：現價 / 市值 / 盈虧 / 權重
    const marks = st.marks ?? {};
    el('holdings')?.querySelectorAll('.hold').forEach((card) => {
      const sym = card.dataset.sym;
      const qty = Number(card.dataset.qty);
      const entry = Number(card.dataset.entry);
      const cur = card.dataset.cur;
      const px = marks[sym];
      if (px == null || !(qty > 0)) return;
      const k = cur === 'USD' ? fx : 1;
      const mv = px * qty * k;
      const pnl = (px - entry) * qty * k;
      const pct = entry > 0 ? (px / entry - 1) * 100 : 0;
      const w = lv.equity ? (mv / lv.equity) * 100 : 0;
      const pill = card.querySelector('.pill');
      if (pill) pill.textContent = `${w.toFixed(1)}%`;
      const sub = card.querySelector('.hsub');
      if (sub) sub.textContent = `${qty} 股 · 成本 ${entry} · 現價 ${px.toFixed(2)}`;
      const row = card.querySelectorAll('.hrow span');
      if (row[0]) row[0].textContent = `市值 ${money(mv)}`;
      if (row[1]) {
        row[1].className = pnl > 0 ? 'up' : pnl < 0 ? 'down' : 'flat';
        row[1].textContent = `${fmtSigned(pnl)}（${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%）`;
      }
    });
    // 時間標記
    const info = el('laneInfo');
    if (info) {
      const t = new Date(st.at).toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const chips = info.querySelectorAll('.chip');
      if (chips.length && !info.dataset.liveAt) {
        const c = document.createElement('span');
        c.className = 'chip'; c.style.cssText = 'padding:3px 8px;margin:2px 4px 2px 0;font-size:11px;color:var(--up)';
        c.textContent = '● 即時';
        info.appendChild(c);
        info.dataset.liveAt = '1';
      }
      const last = info.querySelector('.live-time');
      if (last) last.textContent = t;
      else {
        const c = document.createElement('span');
        c.className = 'chip live-time'; c.style.cssText = 'padding:3px 8px;margin:2px 4px 2px 0;font-size:11px;color:var(--dim)';
        c.textContent = t;
        info.appendChild(c);
      }
    }
  }

  pollLive();
  setInterval(pollLive, 20000);

  /* ---------- 初始化 ---------- */
  el('foot').innerHTML = `日線：Yahoo（免 key）· 即時：Tencent + Sina 備源（非官方）<br>
    資產以港幣計，USD 按 ${D.fx ?? 7.78} 換算 · 未計真錢、未接券商`;
  showTab(location.hash.slice(1) || store.get().tab || 'overview', false);
  drawPrice();
  drawEquity();
  drawBacktest();

  /* ---------- 自動更新：伺服器有新版就 reload（保留分頁） ---------- */
  const REFRESH_MS = Math.max(5, Number(new URLSearchParams(location.search).get('refresh') || 45)) * 1000;
  let stamp = null;
  async function checkUpdate() {
    if (document.hidden) return;
    try {
      const r = await fetch(location.pathname + location.search, { method: 'HEAD', cache: 'no-store' });
      const tag = r.headers.get('etag') || r.headers.get('last-modified') || String(r.headers.get('content-length') || '');
      if (!tag) return;
      if (stamp === null) { stamp = tag; return; }
      if (tag !== stamp) {
        const u = new URL(location.href);
        u.searchParams.set('_v', String(Date.now())); // 破 10 分鐘 cache
        location.replace(u.toString());
      }
    } catch (e) {}
  }
  setInterval(checkUpdate, REFRESH_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
